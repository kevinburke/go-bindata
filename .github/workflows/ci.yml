on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        include:
        - go-version: 1.26.x
          compare-fixtures: true
        - go-version: 1.27.x
          compare-fixtures: false
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v7.1.0
      with:
        go-version: ${{ matrix.go-version }}
    - uses: actions/checkout@v7.0.1
      with:
         path: './src/github.com/kevinburke/go-bindata'
    - uses: actions/cache@v6.1.0
      with:
        path: /home/runner/.cache
        key: ${{ runner.os }}-go-v3-${{ hashFiles('**/*.go') }}
        restore-keys: |
          ${{ runner.os }}-go-v3-
    # staticcheck needs this for GOPATH
    - run: |
        {
          echo "GO111MODULE=on"
          echo "GOPATH=$GITHUB_WORKSPACE"
          echo "PATH=$GITHUB_WORKSPACE/bin:$PATH"
          echo "DEBIAN_FRONTEND=noninteractive"
        } >> "$GITHUB_ENV"
    - name: Run tests
      run: rm -f "${GOPATH}/bin/go-bindata" && make ci-test
      working-directory: './src/github.com/kevinburke/go-bindata'
    # Use one Go version for the byte-for-byte comparison. Go 1.27 can
    # generate different gzip bytes for the same input.
    - name: Check generated fixtures against Git
      if: matrix.compare-fixtures
      run: make diff-testdata
      working-directory: './src/github.com/kevinburke/go-bindata'
    - name: Validate generated fixtures
      if: ${{ !matrix.compare-fixtures }}
      run: make -C testdata
      working-directory: './src/github.com/kevinburke/go-bindata'
